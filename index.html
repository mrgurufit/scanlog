<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>100 Days on Camera — Mr Guru Fit</title>

<meta property="og:title" content="100 Days on Camera — Mr Guru Fit">

<style>
  :root {
    --bg:#0d0f14; --panel:#151a24; --panel2:#1b2130; --line:#232a38;
    --text:#eef2f8; --muted:#8b95a7; --accent:#ffd21e; --green:#3ddc84;
  }
  * { box-sizing:border-box; }
  .bank { margin-top:14px; }
  .bankhead { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
  .bankhead span { color:var(--muted); font-size:14px; }
  .bankhead b {
    margin-inline-start:auto; font-size:26px; letter-spacing:-.5px;
    font-variant-numeric:tabular-nums; color:var(--accent);
  }
  .banktrack {
    margin-top:10px; height:12px; border-radius:99px;
    background:var(--panel2); border:1px solid var(--line); overflow:hidden;
  }
  .banktrack i {
    display:block; height:100%; width:0; border-radius:99px;
    background:linear-gradient(90deg,#ffb800,var(--accent));
    transition:width .6s ease;
  }
  .bankfoot { margin-top:9px; color:var(--muted); font-size:12.5px; line-height:1.65; }
  body {
    margin:0; background:var(--bg); color:var(--text); line-height:1.6;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap { max-width:640px; margin:0 auto; padding:22px 16px 64px; }
  .top { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .brand { display:flex; align-items:center; gap:9px; font-weight:800; letter-spacing:1px; font-size:13px; }
  .lang { display:flex; gap:6px; }
  .lang button {
    padding:6px 12px; border-radius:999px; font-size:12px; font-weight:700; font-family:inherit;
    background:var(--panel2); border:1px solid var(--line); color:var(--muted); cursor:pointer;
  }
  .lang button.on { background:#241a0e; border-color:var(--accent); color:var(--accent); }
  h1 { font-size:29px; line-height:1.2; margin:22px 0 10px; letter-spacing:-.3px; }
  h1 span { color:var(--accent); }
  .lede { font-size:15.5px; color:#c2cad8; margin:0 0 22px; }
  .nums { display:flex; gap:8px; margin:0 0 26px; }
  .num { flex:1; background:var(--panel); border:1px solid var(--line); border-radius:13px; padding:12px 8px; text-align:center; }
  .num b { display:block; font-size:20px; color:var(--accent); font-variant-numeric:tabular-nums; }
  .num small { font-size:11px; color:var(--muted); }
  h2 { font-size:13.5px; text-transform:uppercase; letter-spacing:1.3px; color:var(--muted); margin:30px 0 11px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:16px; margin:0 0 22px; }
  .row { display:flex; align-items:flex-start; gap:11px; padding:9px 0; }
  .row + .row { border-top:1px solid var(--line); }
  .row .ic { flex:0 0 auto; width:30px; height:30px; border-radius:9px; background:var(--panel2);
             display:flex; align-items:center; justify-content:center; font-size:15px; }
  .row b { display:block; font-size:14.5px; }
  .row small { color:var(--muted); font-size:12.5px; }
  .ep { background:var(--panel); border:1px solid var(--line); border-radius:15px; overflow:hidden; }
  .thumb { display:block; width:100%; padding:0; border:0; background:#000; cursor:pointer;
           position:relative; aspect-ratio:16/9; overflow:hidden; }
  .thumb img { width:100%; height:100%; object-fit:cover; display:block; opacity:.82; transition:opacity .2s; }
  .thumb:hover img { opacity:1; }
  .thumb .play { position:absolute; inset:0; margin:auto; width:54px; height:54px; border-radius:50%;
                 background:rgba(255,210,30,.94); color:#141005; font-size:21px;
                 display:flex; align-items:center; justify-content:center; }
  .ep.big .thumb .play { width:68px; height:68px; font-size:26px; }
  .meta { padding:12px 14px 14px; }
  .row1 { display:flex; align-items:baseline; gap:9px; }
  .row1 b { font-size:15px; letter-spacing:.5px; }
  .kg { font-size:12.5px; color:var(--accent); font-variant-numeric:tabular-nums; }
  .meta p { margin:4px 0 0; font-size:13.5px; color:#b6c0cf; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:12px; }
  form { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:18px; margin-top:26px; }
  form h3 { font-size:19px; margin:0 0 6px; }
  form p { font-size:13px; color:var(--muted); margin:0 0 14px; }
  input[type=email] {
    width:100%; padding:14px; font-size:16px; font-family:inherit; color:var(--text);
    background:var(--panel2); border:1px solid var(--line); border-radius:11px;
  }
  input[type=email]:focus { outline:2px solid var(--accent); outline-offset:1px; }
  form button {
    width:100%; margin-top:10px; padding:15px; font-size:16px; font-weight:800; font-family:inherit;
    background:var(--accent); color:#141005; border:0; border-radius:11px; cursor:pointer;
  }
  form button:disabled { opacity:.6; }
  .consent { display:flex; gap:9px; align-items:flex-start; margin-top:12px; font-size:12px; color:var(--muted); }
  .consent input { margin-top:3px; flex:0 0 auto; width:16px; height:16px; accent-color:var(--accent); }
  .consent a { color:#8ab4f8; }
  .msg { margin-top:11px; font-size:14px; min-height:20px; }
  .msg.ok { color:var(--green); } .msg.err { color:#ff8f8f; }
  .wcard { padding:14px 12px 10px; }
  .wwrap { position:relative; }
  .wwrap svg { display:block; width:100%; }
  .wtip { position:absolute; top:0; left:0; pointer-events:none; display:none; z-index:2;
          background:#0d1017f2; border:1px solid var(--line); border-radius:9px;
          padding:7px 10px; white-space:nowrap; }
  .wtip b { display:block; font-size:15px; font-variant-numeric:tabular-nums; direction:ltr; unicode-bidi:isolate; }
  .wtip small { display:block; color:var(--muted); font-size:11.5px; }
  .wtip small .num { direction:ltr; unicode-bidi:isolate; }
  .wfoot { margin:8px 4px 2px; font-size:11.5px; color:var(--muted); }
  .wtable { margin:6px 4px 2px; }
  .wtable summary { font-size:12px; color:var(--muted); cursor:pointer; }
  .wtable table { width:100%; border-collapse:collapse; margin-top:8px;
                  font-size:12.5px; font-variant-numeric:tabular-nums; }
  .wtable th { text-align:start; font-size:11px; color:var(--muted); font-weight:600;
               padding:4px 6px; border-bottom:1px solid var(--line); }
  .wtable td { padding:4px 6px; border-bottom:1px solid var(--line); }
  .wtable td.n { direction:ltr; text-align:start; }
  .wtable .dn { color:var(--green); } .wtable .up { color:#ff8f8f; }
  .who { margin-top:26px; padding-top:20px; border-top:1px solid var(--line); }
  .who p { font-size:13.5px; color:var(--muted); margin:0; }
  .who a { color:#8ab4f8; }
  footer { margin-top:32px; padding-top:16px; border-top:1px solid var(--line);
           font-size:11.5px; color:#5b6474; text-align:center; }
  footer a { color:#6f7a8c; }
  h3.sec { font-size:17px; margin:26px 0 8px; color:var(--accent); }
  .doc p, .doc li { font-size:14.5px; color:#d2d9e4; }
  .doc ul { padding-inline-start:20px; }
</style>
</head>

  <h1 data-th="h1"></h1>

    <details class="wtable"><summary data-t="wtsum"></summary><div id="wtbl"></div></details>

  <h2 data-t="latest"></h2>

  <h2 data-t="all"></h2>

  <form id="f" novalidate>
    <h3 data-t="fh"></h3>
    <p data-t="fp"></p>
    <input type="email" id="email" data-tp="ph" autocomplete="email" required>
    <label class="consent"><input type="checkbox" id="ok" required><span data-th="consent"></span></label>
    <button type="submit" id="go" data-t="btn"></button>
    <div class="msg" id="msg" role="status"></div>
  </form>

  <footer>
    <a href="https://www.youtube.com/@mrgurufit">YouTube</a> ·
    <a href="https://www.instagram.com/mrgurufit">Instagram</a> ·
    <a href="https://www.facebook.com/Mrgurufit">Facebook</a> ·
    <a href="https://www.tiktok.com/@mrgurufit">TikTok</a><br>
    <a href="privacy/" data-t="priv"></a> · <span data-t="foot"></span>
  </footer>

</div>

 },
 "wmid": {

  "he": "שקילת צהריים"
 },
 "wfrom": {
  "en": "from day 1",
  "he": "מיום 1"
 },
 "wtsum": {

  "he": "כל המספרים"
 },
 "wthd": {

  "he": "יום"
 },
 "wthkg": {
  "en": "kg",
  "he": "ק\"ג"
 },
 "wthch": {
  "en": "Change",
  "he": "שינוי"
 }
};

/* English is the default; the choice is remembered per visitor and flips the
   page direction with it. Keys live on the elements so there is one source. */
const LS = "mgf_lang";
let L = localStorage.getItem(LS) || "en";

function paint() {
  document.documentElement.lang = L;
  document.documentElement.dir = L === "he" ? "rtl" : "ltr";
  document.querySelectorAll("[data-t]").forEach(el => {
    const v = TXT[el.dataset.t];
    if (v) el.textContent = v[L];
  });
  document.querySelectorAll("[data-th]").forEach(el => {
    const v = TXT[el.dataset.th];
    if (v) el.innerHTML = v[L];
  });
  document.querySelectorAll("[data-tp]").forEach(el => {
    const v = TXT[el.dataset.tp];
    if (v) el.placeholder = v[L];
  });
  const t = TXT.__title;
  if (t) document.title = t[L];
  document.querySelectorAll(".lang button").forEach(b => b.classList.toggle("on", b.dataset.l === L));
}
document.querySelectorAll(".lang button").forEach(b => {
  b.addEventListener("click", () => {
    L = b.dataset.l;
    localStorage.setItem(LS, L);
    paint();
    if (typeof renderEpisodes === "function") renderEpisodes();
    if (typeof renderBank === "function") renderBank();
  });
});


/* Episodes. One line per day; the nightly task appends the newest at the end. */
const EPISODES = [
  { d: 1, yt: "LhUtdpYMyo0", kg: 111.5, en: "Day one. 111.5 kg, and a camera pointed at all of it.", he: "יום ראשון. 111.5 ק\"ג, ומצלמה על הכל." },
  { d: 2, yt: "olY7rEAQlMk", kg: 109.8, en: "The routine, unedited.", he: "השגרה, בלי עריכה." },
  { d: 3, yt: "W6ZnToeD6h8", kg: 108.6, en: "Training, and every gram weighed.", he: "אימון, וכל גרם על המשקל." },
  { d: 4, yt: "OIvXY7OA68c", kg: 108.1, en: "Same plan. This is what building a habit looks like.", he: "אותה תוכנית. ככה בונים הרגל." },
  { d: 5, yt: "6ZrEZnc1o6w", kg: 107.3, en: "The day the algorithm ignored me. Posted anyway.", he: "היום שהאלגוריתם התעלם ממני. העליתי בכל זאת." },
  { d: 6, yt: "QGZ8HE61xos", kg: 107.6, en: "Uploaded late. Still uploaded.", he: "עלה באיחור. אבל עלה." },
  { d: 7, yt: "D5B5iSaJL1U", kg: 108.0, en: "One week in.", he: "שבוע בפנים." },
  { d: 8, yt: "S4yWKQ9sLYY", kg: 106.7, en: "Chest day, 50 kg dumbbells, and a scream you can hear.", he: "אימון חזה, משקולות 50 קילו, וצעקה ששומעים." },
  { d: 9, yt: "_Hadwj3cDck", kg: 107.1, en: "The scale went up. Here is why that is normal.", he: "המשקל עלה. הנה למה זה נורמלי." },
  { d: 10, yt: "CH5cXyjt3hM", kg: 107.3, en: "Double digits. 10% done.", he: "דו־ספרתי. 10 אחוז מאחורינו." },
  { d: 11, yt: "_8ZnnU5-lN8", kg: 106.4, en: "Three mornings up, then the drop. Patience paid.", he: "שלושה בקרים למעלה, ואז הירידה. הסבלנות השתלמה." },
  { d: 12, yt: "QL4fAePJKGo", kg: 106.2, en: "New low. The zigzag pays back.", he: "שפל חדש. הזיגזג מחזיר את שלו." },
  { d: 13, yt: "gjttLdvwBrE", kg: 105.3, en: "Second new low in a row. Abs day.", he: "שפל שני ברצף. יום בטן." },
  { d: 14, yt: "YH4T9pQjBHY", kg: 107.5, en: "The night I messed up. Up 2.2, mostly water, trained anyway.", he: "הלילה שבו פישלתי. עליתי 2.2, רובם מים, והתאמנתי בכל זאת." },
  { d: 15, yt: "h2_mgndNxw4", kg: 105.5, en: "I said it was water. Two kilos back off in one day.", he: "אמרתי שזה מים. שני קילו ירדו ביום אחד." },
  { d: 16, yt: "PG9_0Xo_vQw", kg: 104.7, en: "Lowest number of the challenge. 40 kg shoulder press, and you can hear it.", he: "המספר הכי נמוך של האתגר. לחיצת כתפיים 40 קילו, ושומעים את זה." },
  { d: 17, yt: "1CCLc3f4Y-Y", kg: 105.6, en: "No gym today. Office until midnight, and I filmed it anyway.", he: "בלי חדר כושר היום. משרד עד חצות, וצילמתי בכל זאת." },
  { d: 18, yt: "KF-2UhwNoDk", kg: null, en: "I said I would go hard. I did. The scale read 107.4, but at midday, not my usual morning weigh-in.", he: "אמרתי שאלך חזק, והלכתי. המאזניים הראו 107.4 — אבל בצהריים, לא בשקילת הבוקר הרגילה." },
  { d: 19, yt: "QprPRjUdeGw", kg: 106.5, en: "Leg day, and you can hear it. The real morning weigh-in is back: 106.5, empty stomach.", he: "יום רגליים, ושומעים את זה. שקילת הבוקר האמיתית חזרה: 106.5, על בטן ריקה." }
];

function epCard(e, big) {
  const kg = e.kg ? '<span class="kg">' + e.kg + ' kg</span>' : "";
  const dayWord = L === "he" ? "יום " : "DAY ";
  return '<article class="ep' + (big ? " big" : "") + '">' +
    '<button class="thumb" data-yt="' + e.yt + '" aria-label="' + dayWord + e.d + '">' +
      '<img loading="lazy" src="https://i.ytimg.com/vi/' + e.yt + '/hqdefault.jpg" alt="' + dayWord + e.d + '">' +
      '<span class="play">&#9654;</span>' +
    '</button>' +
    '<div class="meta"><div class="row1"><b>' + dayWord + e.d + '</b>' + kg + '</div>' +
    '<p>' + (L === "he" ? (e.he || "") : (e.en || "")) + '</p></div></article>';
}

function renderEpisodes() {
  const sorted = EPISODES.slice().sort((a, b) => a.d - b.d);
  const latest = sorted[sorted.length - 1];
  document.getElementById("latest").innerHTML = epCard(latest, true);
  document.getElementById("grid").innerHTML = sorted.slice(0, -1).reverse().map(e => epCard(e, false)).join("");
  const lastKg = sorted.slice().reverse().find(e => e.kg);
  document.getElementById("statNow").textContent = lastKg ? lastKg.kg : "—";
  document.getElementById("statDay").textContent = (L === "he" ? "יום " : "day ") + latest.d;
  document.querySelectorAll(".thumb").forEach(b => {
    b.addEventListener("click", () => {
      const f = document.createElement("iframe");
      f.width = "100%"; f.height = "100%"; f.style.border = "0";
      f.style.aspectRatio = "16/9"; f.style.display = "block";
      f.allow = "accelerometer; autoplay; encrypted-media; picture-in-picture";
      f.allowFullscreen = true;
      f.src = "https://www.youtube.com/embed/" + b.dataset.yt + "?autoplay=1";
      b.replaceWith(f);
    });
  });
}
renderEpisodes();

const ACCOUNT = "2590254";
/* one form per language: the choice on the page decides which stream
   the subscriber joins, so the daily emails arrive in that language */
const FORMS = { en: "196504325381424635", he: "197154687300928663" };
const f = document.getElementById("f"), msg = document.getElementById("msg"), go = document.getElementById("go");
f.addEventListener("submit", async e => {
  e.preventDefault();
  const email = document.getElementById("email").value.trim();
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) {
    msg.className = "msg err"; msg.textContent = TXT.badmail[L]; return;
  }
  if (!document.getElementById("ok").checked) {
    msg.className = "msg err"; msg.textContent = TXT.tick[L]; return;
  }
  go.disabled = true; msg.className = "msg"; msg.textContent = TXT.sending[L];
  const body = new FormData();
  body.append("fields[email]", email);
  body.append("ml-submit", "1");
  body.append("anticsrf", "true");
  try {
    const r = await fetch("https://assets.mailerlite.com/jsonp/" + ACCOUNT + "/forms/" + (FORMS[L] || FORMS.en) + "/subscribe", { method: "POST", body });
    const d = await r.json().catch(() => ({}));
    if (!(d && (d.success || d.ok || r.ok))) throw new Error("rejected");
    f.querySelectorAll("input,button").forEach(el => el.disabled = true);
    msg.className = "msg ok"; msg.textContent = TXT.done[L];
  } catch {
    go.disabled = false; msg.className = "msg err"; msg.textContent = TXT.failed[L];
  }
});

paint();
</script>
<script>
/* The weight, one line per day — the nightly task appends the newest at the
   end, right after it appends the day's EPISODES line. mid:1 marks a weigh-in
   that was not the usual morning one; the chart shows it hollow and says so. */
const WEIGHTS = [
  { d: 1,  kg: 111.5 },
  { d: 2,  kg: 109.8 },
  { d: 3,  kg: 108.6 },
  { d: 4,  kg: 108.1 },
  { d: 5,  kg: 107.3 },
  { d: 6,  kg: 107.6 },
  { d: 7,  kg: 108.0 },
  { d: 8,  kg: 106.7 },
  { d: 9,  kg: 107.1 },
  { d: 10, kg: 107.3 },
  { d: 11, kg: 106.4 },
  { d: 12, kg: 106.2 },
  { d: 13, kg: 105.3 },
  { d: 14, kg: 107.5 },
  { d: 15, kg: 105.5 },
  { d: 16, kg: 104.7 },
  { d: 17, kg: 105.6 },
  { d: 18, kg: 107.4, mid: 1 },
  { d: 19, kg: 106.5 }
];

/* The calorie bank. Same conversion his app uses - 10,000 kcal per kg of fat -
   so the site and the phone can never quote him two different numbers.
   Midday weigh-ins (mid:1) are skipped: day 18 read 107.4 at 12:45 and the
   whole point of flagging it was that it is not comparable, so it must not be
   allowed to move the headline figure either. */
const BANK_START = 111.5, BANK_GOAL = 86.5, KCAL_PER_KG = 10000;

function renderBank() {
  const real = WEIGHTS.filter(w => !w.mid && w.kg);
  const now = real.length ? real[real.length - 1].kg : BANK_START;
  const total = (BANK_START - BANK_GOAL) * KCAL_PER_KG;
  const burned = Math.max(0, (BANK_START - now) * KCAL_PER_KG);
  const left = Math.max(0, total - burned);
  const pct = Math.min(100, (burned / total) * 100);

  const n = x => Math.round(x).toLocaleString(L === "he" ? "he-IL" : "en-US");
  const kg = x => (Math.round(x * 10) / 10).toLocaleString(L === "he" ? "he-IL" : "en-US");

  document.getElementById("bankLeft").textContent = n(left);
  document.getElementById("bankFill").style.width = pct.toFixed(1) + "%";
  document.getElementById("bankFoot").innerHTML = L === "he"
    ? `25 ק"ג שומן, 10,000 קק"ל לכל קילו, הם <b>${n(total)}</b> לשרוף.
       ירדו עד כה <b>${kg(BANK_START - now)} ק"ג</b> ${'—'} כלומר
       <b>${n(burned)}</b> כבר נשרפו, <b>${pct.toFixed(1)}%</b> מהדרך.
       הבר עוקב אחרי שקילות הבוקר בלבד; שקילת צהריים לא מזיזה אותו.`
    : `25 kg of fat at 10,000 kcal per kg is <b>${n(total)}</b> to burn.
       <b>${kg(BANK_START - now)} kg</b> down so far, so <b>${n(burned)}</b>
       of it is gone ${'—'} <b>${pct.toFixed(1)}%</b> of the way.
       The bar follows morning weigh-ins only; a midday reading never moves it.`;
}

function renderWeight() {
  const pts = WEIGHTS.filter(p => typeof p.kg === "number").sort((a, b) => a.d - b.d);
  const wrap = document.getElementById("wwrap");
  if (!wrap || pts.length < 2) return;

  const W = Math.max(280, wrap.clientWidth), H = 240;
  const M = { t: 24, r: 16, b: 26, l: 34 };
  const iw = W - M.l - M.r, ih = H - M.t - M.b;

  const kgs = pts.map(p => p.kg);
  const lo = Math.floor(Math.min(...kgs) - 0.4), hi = Math.ceil(Math.max(...kgs) + 0.4);
  const d0 = pts[0].d, d1 = pts[pts.length - 1].d;
  const x = d => M.l + (d - d0) / (d1 - d0) * iw;
  const y = kg => M.t + (hi - kg) / (hi - lo) * ih;

  const yStep = (hi - lo) > 6 ? 2 : 1;
  let g = "", xl = "", yl = "";
  for (let v = lo; v <= hi; v += yStep) {
    g += '<line x1="' + M.l + '" y1="' + y(v) + '" x2="' + (W - M.r) + '" y2="' + y(v) + '" stroke="#232a38" stroke-width="1"/>';
    yl += '<text x="' + (M.l - 7) + '" y="' + (y(v) + 3.5) + '" text-anchor="end" font-size="10.5" fill="#8b95a7">' + v + '</text>';
  }
  const xStep = [1, 2, 5, 10, 20].find(s => (d1 - d0) / s <= 8) || 20;
  const xdays = [];
  for (let d = d0; d <= d1; d += xStep) xdays.push(d);
  if (xdays[xdays.length - 1] !== d1) {
    if (d1 - xdays[xdays.length - 1] < xStep / 2) xdays.pop();
    xdays.push(d1);
  }
  xdays.forEach(d => {
    xl += '<text x="' + x(d) + '" y="' + (H - 8) + '" text-anchor="middle" font-size="10.5" fill="#8b95a7">' + d + '</text>';
  });

  const line = pts.map((p, i) => (i ? "L" : "M") + x(p.d).toFixed(1) + " " + y(p.kg).toFixed(1)).join(" ");
  const area = line + " L" + x(d1).toFixed(1) + " " + (H - M.b) + " L" + x(d0).toFixed(1) + " " + (H - M.b) + " Z";

  let dots = "";
  pts.forEach(p => {
    dots += p.mid
      ? '<circle cx="' + x(p.d) + '" cy="' + y(p.kg) + '" r="3.5" fill="#151a24" stroke="#ffd21e" stroke-width="2"/>'
      : '<circle cx="' + x(p.d) + '" cy="' + y(p.kg) + '" r="3.5" fill="#ffd21e"/>';
  });

  /* selective labels: start, lowest, latest — never one on every point */
  const minP = pts.reduce((a, b) => (b.kg < a.kg ? b : a));
  let lbl = "";
  const put = (p, dy, anchor) => {
    lbl += '<text x="' + x(p.d) + '" y="' + (y(p.kg) + dy) + '" text-anchor="' + anchor +
           '" font-size="11" font-weight="700" fill="#eef2f8">' + p.kg + '</text>';
  };
  put(pts[0], -9, "start");
  if (minP !== pts[0] && minP !== pts[pts.length - 1]) put(minP, 16, "middle");
  put(pts[pts.length - 1], -9, "end");

  wrap.innerHTML =
    '<svg viewBox="0 0 ' + W + " " + H + '" width="' + W + '" height="' + H + '" style="direction:ltr" role="img" aria-label="' + (TXT.wt[L] || "") + '">' +
    '<defs><linearGradient id="wgrad" x1="0" y1="0" x2="0" y2="1">' +
    '<stop offset="0" stop-color="#ffd21e" stop-opacity="0.16"/><stop offset="1" stop-color="#ffd21e" stop-opacity="0"/>' +
    "</linearGradient></defs>" +
    g + yl + xl +
    '<path d="' + area + '" fill="url(#wgrad)"/>' +
    '<path d="' + line + '" fill="none" stroke="#ffd21e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>' +
    '<line id="wxh" y1="' + M.t + '" y2="' + (H - M.b) + '" stroke="#8b95a7" stroke-width="1" stroke-dasharray="3 3" opacity="0"/>' +
    dots + lbl +
    "</svg>";

  const tip = document.createElement("div");
  tip.className = "wtip";
  const tv = document.createElement("b"), ts = document.createElement("small"), tm = document.createElement("small");
  const tsDay = document.createElement("span"), tsNum = document.createElement("span"), tsFrom = document.createElement("span");
  tsNum.className = "num";
  ts.append(tsDay, tsNum, tsFrom);
  tip.append(tv, ts, tm);
  wrap.appendChild(tip);

  const svg = wrap.querySelector("svg"), xh = wrap.querySelector("#wxh");
  const dayWord = () => (L === "he" ? "יום" : "DAY");
  function show(p) {
    const dlt = (p.kg - pts[0].kg).toFixed(1);
    tv.textContent = p.kg + " kg";
    tsDay.textContent = dayWord() + " " + p.d + " • ";
    tsNum.textContent = (dlt > 0 ? "+" : "") + dlt + " kg";
    tsFrom.textContent = " " + TXT.wfrom[L];
    tm.textContent = p.mid ? TXT.wmid[L] : "";
    tm.style.display = p.mid ? "block" : "none";
    xh.setAttribute("x1", x(p.d)); xh.setAttribute("x2", x(p.d)); xh.setAttribute("opacity", "0.5");
    tip.style.display = "block";
    const r = wrap.getBoundingClientRect(), s = r.width / W;
    let tx = x(p.d) * s + 12;
    if (tx + tip.offsetWidth > r.width - 4) tx = x(p.d) * s - tip.offsetWidth - 12;
    let ty = y(p.kg) * s - tip.offsetHeight - 10;
    if (ty < 0) ty = y(p.kg) * s + 14;
    tip.style.transform = "translate(" + tx + "px," + ty + "px)";
  }
  svg.addEventListener("pointermove", ev => {
    const r = svg.getBoundingClientRect();
    const px = (ev.clientX - r.left) / (r.width / W);
    let best = pts[0];
    pts.forEach(p => { if (Math.abs(x(p.d) - px) < Math.abs(x(best.d) - px)) best = p; });
    show(best);
  });
  svg.addEventListener("pointerleave", () => {
    tip.style.display = "none"; xh.setAttribute("opacity", "0");
  });

  /* footnote + table view, so every number is reachable without hovering */
  const foot = document.getElementById("wfoot");
  foot.textContent = TXT.wnote[L] + (pts.some(p => p.mid) ? " " + TXT.wmidnote[L] : "");
  const tbl = document.getElementById("wtbl");
  tbl.textContent = "";
  const t = document.createElement("table"), hr = document.createElement("tr");
  [TXT.wthd[L], TXT.wthkg[L], TXT.wthch[L]].forEach(h => {
    const th = document.createElement("th"); th.textContent = h; hr.appendChild(th);
  });
  t.appendChild(hr);
  pts.forEach((p, i) => {
    const tr = document.createElement("tr");
    const c1 = document.createElement("td"); c1.textContent = p.d + (p.mid ? " *" : "");
    const c2 = document.createElement("td"); c2.className = "n"; c2.textContent = p.kg.toFixed(1);
    const c3 = document.createElement("td"); c3.className = "n";
    if (i) {
      const ch = Math.round((p.kg - pts[i - 1].kg) * 10) / 10;
      c3.textContent = (ch > 0 ? "+" : "") + ch.toFixed(1);
      if (ch < 0) c3.classList.add("dn"); else if (ch > 0) c3.classList.add("up");
    } else c3.textContent = "—";
    tr.append(c1, c2, c3);
    t.appendChild(tr);
  });
  tbl.appendChild(t);
  if (pts.some(p => p.mid)) {
    const note = document.createElement("div");
    note.style.cssText = "margin-top:6px;font-size:11px;color:#8b95a7";
    note.textContent = "* " + TXT.wmid[L];
    tbl.appendChild(note);
  }
}
renderWeight();
document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", renderWeight));
let wRsz;
window.addEventListener("resize", () => { clearTimeout(wRsz); wRsz = setTimeout(renderWeight, 150); });
</script>
<script>

   so refreshes and back-navigation do not inflate the number. */

      if (!sessionStorage.getItem("mgf_seen")) {
        sessionStorage.setItem("mgf_seen", "1");
        first = "1";

    var u = "https://hook.us2.make.com/iwafet153pkallo64gaqd7ryoutllx4x"
          + "?s=" + first + "&p=" + encodeURIComponent(location.pathname);
    if (navigator.sendBeacon) navigator.sendBeacon(u);
    else fetch(u, { mode: "no-cors", keepalive: true }).catch(function () {});
  } catch (e) { /* measurement must never break the page */ }
})();

renderBank();
</script>
