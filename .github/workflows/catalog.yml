name: Compile community catalog

# Every 10 minutes cost ~28 Make operations a run - about 4,000 a day - and
# on 2026-09-09 that alone drained the month's 20,000 and paused the whole
# Make account, which took every webhook in the project down with it.
# The catalog changes a couple of times a week and every phone pulls it
# once a day, so a nightly compile loses nothing. Use "Run workflow" to
# publish an approval immediately.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: catalog-compile
  cancel-in-progress: false

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The Make REST API costs NO operations - only scenario runs do. The
      # export scenario costs roughly one operation per product, so it got
      # dearer every time someone contributed one. With MAKE_API_TOKEN set as a
      # repository secret this compile is free at any catalog size; without it
      # the old webhook still works, so the catalog never depends on the token.
      # The Make REST API costs NO operations - only scenario runs do. The
      # export scenario costs roughly one operation per product, so it got
      # dearer every time someone contributed one. With MAKE_API_TOKEN set as a
      # repository secret this compile is free at any catalog size; without it
      # the old webhook still works, so the catalog never depends on the token.
      - name: Fetch the shared product store
        env:
          MAKE_API_TOKEN: ${{ secrets.MAKE_API_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error

          HOOK = "https://hook.us2.make.com/m45uuq5j27h89anwnudw51kbotbg55fg"
          API = "https://us2.make.com/api/v2/data-stores/140664/data"
          PAGE = 100          # the endpoint's own maximum: "Available maximum limit 100"

          # Cloudflare sits in front of make.com and answers Python's default
          # User-Agent with 403 "error code: 1010" - a browser-signature ban,
          # not an auth problem. Any real UA gets through.
          UA = {"User-Agent": "mrgurufit-catalog-compile/1.0",
                "Accept": "application/json"}

          def get(url, headers=None, timeout=120):
              h = dict(UA)
              h.update(headers or {})
              req = urllib.request.Request(url, headers=h)
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as f:
                      return f.read().decode("utf-8", "replace")
              except urllib.error.HTTPError as e:
                  body = e.read().decode("utf-8", "replace")[:500]
                  raise SystemExit("HTTP %s from %s\n%s" % (e.code, url.split("?")[0], body))

          tok = (os.environ.get("MAKE_API_TOKEN") or "").strip()
          out = []
          if tok:
              print("reading the data store through the Make API (0 operations)")
              off = 0
              while True:
                  url = "%s?pg%%5Blimit%%5D=%d&pg%%5Boffset%%5D=%d" % (API, PAGE, off)
                  raw = json.loads(get(url, {"Authorization": "Token " + tok}))
                  rows = raw.get("records", raw) if isinstance(raw, dict) else raw
                  if not isinstance(rows, list):
                      raise SystemExit("unexpected API shape: %s" % str(raw)[:300])
                  for r in rows:
                      d = r.get("data", r) if isinstance(r, dict) else {}
                      if isinstance(d, dict):
                          out.append(d)
                  if len(rows) < PAGE:
                      break
                  off += PAGE
          else:
              print("MAKE_API_TOKEN not set - falling back to the export webhook "
                    "(~1 operation per product)")
              out = json.loads(get(HOOK))

          json.dump(out, open("export.json", "w"), ensure_ascii=False)
          print("records:", len(out))
          PY

      # A camera/gallery product photo arrives as a data: URL. Count the ones we
      # have not hosted yet - we only spin up Python when there is at least one.
      - name: Count photos to host
        id: pending
        run: |
          set -euo pipefail
          count=$(python3 -c "
          import json, os
          d=json.load(open('export.json'))
          n=sum(1 for r in d
                if str(r.get('barcode','') or '').strip()
                and str(r.get('status','') or '').strip().lower() not in ('pending','rejected')
                and (r.get('photo','') or '').startswith('data:image')
                and not os.path.exists('app/img/'+str(r.get('barcode')).strip()+'.jpg'))
          print(n)
          ")
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "photos to host: $count"

      - name: Set up Python
        if: steps.pending.outputs.count != '0'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Host uploaded product photos, write the URLs back
        if: steps.pending.outputs.count != '0'
        run: |
          set -euo pipefail
          pip install --quiet pillow
          python3 - <<'PY'
          import json, os, io, base64, urllib.request
          from PIL import Image

          CONTRIB = 'https://hook.us2.make.com/n12hl57ay5q6q2hji6ufsbjxis4r8fyo'
          os.makedirs('app/img', exist_ok=True)
          data = json.load(open('export.json'))
          done = []

          for r in data:
              bc = str(r.get('barcode','') or '').strip()
              ph = r.get('photo','') or ''
              st = str(r.get('status','') or '').strip().lower()
              if not bc or not ph.startswith('data:image') or st in ('pending','rejected'):
                  continue   # never host/process a photo that is not approved yet
              out = f'app/img/{bc}.jpg'
              if os.path.exists(out):
                  continue
              try:
                  raw = base64.b64decode(ph.split(',', 1)[1])
                  img = Image.open(io.BytesIO(raw)).convert('RGB')   # keep the photo as-is - no background removal
                  img.thumbnail((640, 640))                          # just resize for the web
                  img.save(out, 'JPEG', quality=85)
                  done.append((bc, r))
                  print('hosted photo ->', out)
              except Exception as e:
                  print('skip', bc, repr(e))

          # Replace the raw base64 in the shared store with the hosted URL, so the
          # next export is lean and this photo is never processed twice.
          def num(x):
              try: return float(x)
              except Exception: return 0
          for bc, r in done:
              body = json.dumps({
                  'barcode': bc,
                  'name': r.get('name', '') or '',
                  'kcal': num(r.get('kcal', 0)), 'pro': num(r.get('pro', 0)),
                  'carb': num(r.get('carb', 0)), 'fat': num(r.get('fat', 0)),
                  'photo': f'https://mrgurufit.com/app/img/{bc}.jpg',
                  'pt': r.get('pt', '') or '', 'src': r.get('src', 'app') or 'app',
              }, ensure_ascii=False).encode('utf-8')
              try:
                  req = urllib.request.Request(CONTRIB, data=body,
                      headers={'Content-Type': 'application/json; charset=utf-8'})
                  urllib.request.urlopen(req, timeout=30).read()
                  print('wrote back hosted URL for', bc)
              except Exception as e:
                  print('write-back failed', bc, repr(e))
          PY

      - name: Build catalog.json
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, datetime
          data = json.load(open('export.json'))

          def num(x):
              try: return float(x)
              except Exception: return 0

          # Additive: start from the catalog we already published so seeded and
          # past products persist forever; the fresh Make export overlays on top.
          try:
              codes = json.load(open('app/catalog.json')).get('codes', {})
          except Exception:
              codes = {}
          for r in data:
              bc = str(r.get('barcode', '') or '').strip()
              nm = r.get('name', '')
              st = str(r.get('status', '') or '').strip().lower()
              # A non-admin's hand-typed product waits in the shared store as
              # 'pending' until Ido approves it in the app; 'rejected' stays out
              # for good. Neither ever reaches the public catalog.
              if not bc or not nm or st in ('pending', 'rejected'):
                  continue
              local = f'app/img/{bc}.jpg'
              ph = r.get('photo', '') or ''
              if os.path.exists(local):
                  img = f'https://mrgurufit.com/app/img/{bc}.jpg'   # our hosted photo wins
              elif ph.startswith('http'):
                  img = ph
              else:
                  img = ''
              code = {'n': nm, 'k': num(r.get('kcal', 0)), 'p': num(r.get('pro', 0)),
                      'c': num(r.get('carb', 0)), 'f': num(r.get('fat', 0)), 'img': img}
              pt = r.get('pt', '')
              if isinstance(pt, str) and pt.strip():
                  try:
                      arr = json.loads(pt)
                      if isinstance(arr, list) and arr:
                          code['pt'] = arr
                  except Exception:
                      pass
              elif isinstance(pt, list) and pt:
                  code['pt'] = pt
              codes[bc] = code

          # A reject has to remove a product that already went out. Products
          # publish themselves now, so skipping rejected rows in the NEW data is
          # not enough - the carried-forward catalog has to drop them as well.
          for r in data:
              bc = str(r.get('barcode', '') or '').strip()
              if bc and str(r.get('status', '') or '').strip().lower() == 'rejected':
                  codes.pop(bc, None)

          out = {'v': datetime.date.today().isoformat(), 'count': len(codes), 'codes': codes}
          json.dump(out, open('catalog.new', 'w'), ensure_ascii=False, separators=(',', ':'))
          print('built catalog with', len(codes), 'codes')

          # The products still waiting for Ido's approval, written out so his
          # inbox does not have to buy the whole store from Make to show a
          # badge. No personal data is in these rows - barcode, name, macros,
          # a photo and a timestamp - the same fields the public catalog holds.
          pend = [{'barcode': str(r.get('barcode', '') or '').strip(),
                   'name': r.get('name', '') or '',
                   'kcal': num(r.get('kcal', 0)), 'pro': num(r.get('pro', 0)),
                   'carb': num(r.get('carb', 0)), 'fat': num(r.get('fat', 0)),
                   'photo': r.get('photo', '') or '', 'pt': r.get('pt', '') or '',
                   'src': r.get('src', '') or '', 'at': r.get('at', '') or '',
                   'status': 'pending'}
                  for r in data
                  if str(r.get('status', '') or '').strip().lower() == 'pending'
                  and str(r.get('barcode', '') or '').strip() and r.get('name')]
          json.dump({'v': datetime.date.today().isoformat(), 'count': len(pend),
                     'items': pend},
                    open('pending.new', 'w'), ensure_ascii=False, separators=(',', ':'))
          print('built pending list with', len(pend), 'items')
          PY

      - name: Commit only if the products or photos changed
        run: |
          set -euo pipefail
          old="$(python3 -c "import json; print(json.dumps(json.load(open('app/catalog.json')).get('codes',{}),sort_keys=True,ensure_ascii=False))" 2>/dev/null || echo '{}')"
          new="$(python3 -c "import json; print(json.dumps(json.load(open('catalog.new')).get('codes',{}),sort_keys=True,ensure_ascii=False))")"
          oldp="$(cat app/pending.json 2>/dev/null | python3 -c "import json,sys; print(json.dumps(json.load(sys.stdin).get('items',[]),sort_keys=True,ensure_ascii=False))" 2>/dev/null || echo '[]')"
          newp="$(python3 -c "import json; print(json.dumps(json.load(open('pending.new')).get('items',[]),sort_keys=True,ensure_ascii=False))")"
          if [ "$old" = "$new" ] && [ "$oldp" = "$newp" ]; then
            echo "catalog and pending list unchanged - nothing to publish"
            exit 0
          fi
          mv catalog.new app/catalog.json
          mv pending.new app/pending.json
          git config user.name "catalog-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/catalog.json app/pending.json
          [ -d app/img ] && git add app/img || true
          git commit -m "Catalog: republish community products ($(python3 -c "import json;print(json.load(open('app/catalog.json'))['count'])") items)"
          git push
