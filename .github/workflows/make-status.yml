name: Publish Make operations status

# Ido, 2026-09-13: "show me the Make operations in real time on the HQ page".
# The Make REST API itself costs NO operations (only scenario RUNS do - same
# fact the catalog compile already relies on for MAKE_API_TOKEN), so polling
# this every 10 minutes is free. This is the exact signal that would have
# caught the account pausing itself dead on 2026-09-09/09-10 BEFORE it
# happened, instead of finding out from a dead webhook.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: make-status
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch organization usage from Make (0 operations - platform API, not a scenario run)
        env:
          MAKE_API_TOKEN: ${{ secrets.MAKE_API_TOKEN }}
          MAKE_ORG_ID: "8634614"
          MAKE_ZONE: "us2.make.com"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys, urllib.request, urllib.error, datetime

          tok = (os.environ.get("MAKE_API_TOKEN") or "").strip()
          org = os.environ["MAKE_ORG_ID"]
          zone = os.environ["MAKE_ZONE"]
          if not tok:
              print("MAKE_API_TOKEN not set - skipping (no status published)")
              sys.exit(0)

          url = f"https://{zone}/api/v2/organizations/{org}"
          req = urllib.request.Request(url, headers={
              "Authorization": "Token " + tok,
              "User-Agent": "mrgurufit-make-status/1.0",
              "Accept": "application/json",
          })
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  d = json.loads(r.read())
          except urllib.error.HTTPError as e:
              body = e.read().decode("utf-8", "replace")[:300]
              print(f"HTTP {e.code} from Make organizations API: {body}")
              sys.exit(0 if e.code in (401, 403) else 1)

          used = int(d.get("operations", 0) or 0)
          limit = int((d.get("license") or {}).get("operations", 0) or 0)
          out = {
              "checkedAt": datetime.datetime.utcnow().isoformat() + "Z",
              "used": used,
              "limit": limit,
              "unused": int(d.get("unusedOperations", 0) or 0),
              "percentUsed": round(100 * used / limit, 1) if limit else 0,
              "isPaused": bool(d.get("isPaused")),
              "activeScenarios": d.get("activeScenarios", 0),
              "lastReset": d.get("lastReset", ""),
              "nextReset": d.get("nextReset", ""),
          }
          os.makedirs("app", exist_ok=True)
          # only touch the file (and only commit) if something actually changed -
          # same discipline as the catalog compile, so this never spams history
          old = {}
          try:
              old = json.load(open("app/make-status.json", encoding="utf-8"))
          except Exception:
              pass
          comparable = {k: v for k, v in out.items() if k != "checkedAt"}
          old_comparable = {k: v for k, v in old.items() if k != "checkedAt"}
          if comparable == old_comparable:
              print("no change in Make status - not touching checkedAt either")
              sys.exit(0)
          json.dump(out, open("app/make-status.json", "w", encoding="utf-8"),
                     ensure_ascii=False, separators=(",", ":"))
          print("wrote app/make-status.json:", out)
          PY

      - name: Commit if changed
        run: |
          set -euo pipefail
          if git diff --quiet -- app/make-status.json; then
            echo "nothing to commit"
            exit 0
          fi
          git config user.name "make-status-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/make-status.json
          git commit -m "Make status: update operations usage snapshot"
          git push
